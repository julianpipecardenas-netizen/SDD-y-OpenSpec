{% extends "reservas/base.html" %}
{% block titulo %}Error{% endblock %}
{% block contenido %}
  <div class="error" role="alert">
    <span class="codigo">{{ error.codigo }}</span>
    <p>{{ error.mensaje }}</p>
  </div>
  {% if user.is_authenticated %}
    <p><a href="{% url 'inicio' %}">Volver al inicio</a></p>
  {% else %}
    <p><a href="{% url 'login' %}">Iniciar sesión</a></p>
  {% endif %}
{% endblock %}
